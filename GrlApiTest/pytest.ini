[pytest]
testpaths = test_cases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --cov=api_clients --cov=utils --cov-report=term-missing
console_output_style = progress
markers =
    smoke: 冒烟测试，核心流程快速验证
    regression: 回归测试，全量业务场景
    slow: 慢速测试，包含等待或大量数据处理
    backend_bug: 后端缺陷，预期失败但后端返回成功
    security: 安全测试，SQL注入/XSS等