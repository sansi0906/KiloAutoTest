[pytest]
# 测试目录
testpaths = tests

# 标记
markers =
    smoke: 冒烟测试
    regression: 回归测试
    slow: 慢速测试

# Allure 报告
addopts =
    -v
    --tb=short
    --alluredir=reports/allure-results
    --clean-alluredir
    --reruns=1
    --reruns-delay=2

# 日志
log_cli = true
log_cli_level = INFO
log_cli_format = [%(asctime)s] [%(levelname)-5s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
