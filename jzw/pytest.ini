[pytest]
# 测试目录
testpaths = tests

# 测试文件命名规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 命令行参数
addopts =
    -v
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --screenshot=on

# 标记
markers =
    smoke: 冒烟测试
    home: 首页模块
    goods: 商品模块
    orders: 订单模块
    mine: 我的模块
    settings: 系统设置模块
    login: 登录模块
