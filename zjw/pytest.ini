[pytest]
# 测试目录
testpaths = tests

# 测试文件匹配模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 命令行选项
addopts = 
    -v
    --tb=short
    --alluredir=reports/allure-results

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 标记
markers =
    smoke: 冒烟测试
    regression: 回归测试
    slow: 慢速测试
    order1: 第一组测试
    order2: 第二组测试
    order3: 第三组测试
    order4: 第四组测试
    order5: 第五组测试
